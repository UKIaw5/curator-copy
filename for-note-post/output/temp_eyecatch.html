
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                margin: 0;
                width: 1920px;
                height: 1006px;
                background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 120px 140px;
                box-sizing: border-box;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: #f8fafc;
            }
            .badge {
                background: #3b82f6;
                color: white;
                font-size: 28px;
                font-weight: 600;
                padding: 12px 28px;
                border-radius: 10px;
                width: fit-content;
                letter-spacing: 0.05em;
            }
            .title {
                font-size: 72px;
                font-weight: 800;
                line-height: 1.35;
                color: #ffffff;
                margin: 0;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-top: 1px solid rgba(255, 255, 255, 0.15);
                padding-top: 36px;
            }
            .brand {
                font-size: 32px;
                font-weight: 700;
                color: #94a3b8;
                letter-spacing: 0.05em;
            }
        </style>
    </head>
    <body>
        <div class="badge">TECHNICAL INSIGHT</div>
        <div class="title">GPTコード生成、ゲーム業界で試して感じた限界——Anti-Cheat以外で本当に使える場面はあるのか</div>
        <div class="footer">
            <div class="brand">Local LLM & MLOps Pipeline</div>
        </div>
    </body>
    </html>
